{% load static %}
<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ error_status }} · {{ error_title }} · HiTOP</title>
    <link rel="icon" type="image/png" href="{% static 'images/hitop_icon-removebg-preview.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <section class="card border-0 shadow-sm text-center" style="max-width: 620px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <img src="{% static 'images/hitop_icon-removebg-preview.png' %}" alt="HiTOP" width="54" class="mb-4">
                <p class="text-primary fw-semibold mb-2">Erro {{ error_status }}</p>
                <h1 class="h2 mb-3">{{ error_title }}</h1>
                <p class="text-secondary mb-4">{{ error_message }}</p>
                <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                    <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
                        ← Página anterior
                    </button>
                    <a href="{% url 'website:home' %}" class="btn btn-primary">
                        Ir para o início
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
