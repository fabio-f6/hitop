{% if scales %}

<div class="mt-4">

    <table class="table table-sm table-hover align-middle">

        <thead class="table-light">

            <tr>

                <th>Escala</th>

                <th class="text-end" style="width: 120px;">
                    Valor bruto
                </th>

                <th class="text-center" style="width: 100px;">
                    Percentil
                </th>

            </tr>

        </thead>

        <tbody>

            {% for item in scales %}

            <tr>

                <td>
                    {{ item.name }}
                </td>

                <td class="text-end">

                    {% if item.is_valid %}
                        {{ item.score|floatformat:2 }}
                    {% else %}
                        Nulo
                    {% endif %}

                </td>

                <td class="text-center">

                    {% if item.is_valid %}
                        {{ item.percentile }}
                    {% else %}
                        Nulo
                    {% endif %}

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endif %}
