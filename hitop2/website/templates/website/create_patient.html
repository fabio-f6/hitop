{% extends 'base.html' %}
{% block content %}

<div class="col-md-6 offset-md-3">

<h2>Novo paciente e aplicação HiTOP</h2>
<br>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        {{ form.username.label_tag }}
        {{ form.username }}
    </div>

    <div class="mb-3">
        {{ form.title.label_tag }}
        {{ form.title }}
    </div>

    <div class="mb-3">
        <label>
            Spectras incluídos
        </label>
        {{ form.spectra }}
    </div>

    <br>

    <button type="submit" class="btn btn-sm rounded-0"
   style="background-color: #e2f0ff; color: #000; 
          border: 1px solid #9ec9ff; padding: 0.5rem 1rem;">
        Criar registro
    </button>

</form>

</div>

{% endblock %}
