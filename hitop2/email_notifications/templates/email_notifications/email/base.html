<!doctype html>
<html lang="pt">
<body style="margin:0; padding:0; background:#f5f7fa; color:#222; font-family:Arial,sans-serif;">
  <div style="max-width:620px; margin:0 auto; padding:28px 16px;">
    <div style="background:#eef4fb; border:1px solid #d5dde8; padding:18px 24px; font-size:22px;">HiTOP Platform</div>
    <div style="background:#fff; border:1px solid #d5dde8; border-top:0; padding:24px; line-height:1.55;">
      {% block email_content %}{% endblock %}
    </div>
    <div style="padding:14px 4px; color:#777; font-size:12px; line-height:1.5;">
      HiTOP Platform — Universidade Lusófona<br>
      {% block email_footer %}{% endblock %}
    </div>
  </div>
</body>
</html>
